name: Bug report
description: A title is wrong, missing, or something broke
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a title that came out wrong, the two things below are worth
        more than any description you can write of it.

        Do not report security problems here — see
        [SECURITY.md](https://github.com/asterxsk/quick-titles/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The title you got, and what you expected instead.
      placeholder: |
        The session was named "FILES: src/core/store.ts src/core/paths.ts ..." instead of a title.
    validations:
      required: true

  - type: input
    id: steps
    attributes:
      label: What did you do just before it
      description: The prompt you typed is usually enough.
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      options:
        - Claude Code
        - Codex CLI
        - opencode2
        - Pi
        - Not an adapter — the CLI or the daemon
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx quick-titles doctor`
      description: |
        Paste it whole. It reports the data directory, whether a model is provisioned, and which
        backend is serving. Most reports are answered by this line alone.
      render: text
    validations:
      required: true

  - type: textarea
    id: sessions
    attributes:
      label: Output of `npx quick-titles sessions`
      description: |
        Optional, and worth it for anything about a title's content. It is the only view of the
        descriptions quick-titles generates. Redact anything private before pasting.
      render: text
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: quick-titles version
      description: "`npx quick-titles --version`, first line."
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Node version
      placeholder: "Windows 11 26200, Node 22.11.0"
    validations:
      required: true
